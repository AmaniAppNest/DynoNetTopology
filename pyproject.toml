[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynonettopology"
version = "0.1.0"
description = "Multiscale Dynamic Network–Topology Framework for Quantum-Sensed Complex Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "gudhi>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]
